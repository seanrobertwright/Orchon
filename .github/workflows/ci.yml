name: CI

# Every gate runs against the newest released Orca: the plugin directory validates a listing
# with that release, and a tag is installed unattended 12 hours after it is listed. When that
# release cannot be downloaded, only the gates that need no Orca run, and the run warns.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Gates on the latest Orca
    # Orca's CLI ships inside the desktop app. The macOS build runs it without a display.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      # The whole history with its tags, so the approval surface can be compared with the last
      # released tag.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # The download is the one step allowed to fail: when github.com cannot serve Orca, the
      # gates that need no Orca still run and decide the result, and those that need it are
      # skipped and named in a warning and the job summary.
      - name: Install the latest Orca release
        id: orca
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/orca"
          gh release download --repo stablyai/orca --pattern 'Orca-*-arm64-mac.zip' --dir "$RUNNER_TEMP/orca"
          ditto -x -k "$RUNNER_TEMP"/orca/Orca-*-arm64-mac.zip "$RUNNER_TEMP/orca"
          echo "$RUNNER_TEMP/orca/Orca.app/Contents/Resources/bin" >> "$GITHUB_PATH"

      - name: Report the gates skipped without Orca
        if: steps.orca.outcome == 'failure'
        run: |
          echo "::warning title=Orca is missing::The latest Orca release could not be downloaded, so the gates that need Orca are skipped. This run is a weaker gate than a full run; see the job summary."
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Gates skipped: Orca could not be downloaded

          The latest Orca release could not be downloaded from github.com, so this run skipped
          every gate that needs Orca's CLI or the typings `orca plugin types .` writes. The gates
          that need no Orca ran and decide the result. This run is a weaker gate than a full run.

          | Skipped gate | Why it needs Orca |
          | --- | --- |
          | `orca plugin types .` | It is Orca's CLI. |
          | `npm run typecheck` | The tsconfig extends the typings `orca plugin types .` writes. |
          | `npm run check:editors` | It compiles the editors against the typings `orca plugin types .` writes. |
          | `orca plugin test .` | It is Orca's CLI. |
          | `orca plugin check .` | It is Orca's CLI. |
          | `orca plugin validate .` | It is Orca's CLI. |
          SUMMARY

      - name: Install the development dependencies
        run: npm ci --ignore-scripts

      - name: Pre-commit check on every tracked file
        run: npm run check:tracked

      - name: Generate Orca's types
        if: steps.orca.outcome == 'success'
        run: orca plugin types .

      - name: Type-check the whole repository
        if: steps.orca.outcome == 'success'
        run: npm run typecheck

      - name: Committed editor JavaScript equals the compiler output
        if: steps.orca.outcome == 'success'
        run: npm run check:editors

      - name: ESLint
        run: npm run lint

      - name: markdownlint
        run: npm run lint:md

      - name: Tests
        if: steps.orca.outcome == 'success'
        run: orca plugin test .

      - name: Render the panel and check the editors
        if: steps.orca.outcome == 'success'
        run: orca plugin check .

      - name: Validate the plugin as Orca loads it
        if: steps.orca.outcome == 'success'
        run: orca plugin validate .

      - name: Install limits
        run: npm run check:limits

      # The approval surface may change only in a release whose minor version rises and whose
      # changelog entry asks you to approve again. Before the first tag there is nothing to compare.
      - name: Approval surface against the last released tag
        run: |
          set -euo pipefail
          tag=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$tag" ]; then
            node scripts/check-approval-surface.ts
          else
            git show "$tag:orca-plugin.json" | node scripts/check-approval-surface.ts --tag "$tag"
          fi
